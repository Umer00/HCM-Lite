{% extends 'base.html' %}{% block title %}Company settings{% endblock %}{% block heading %}Company settings{% endblock %}{% block content %}<div class="page-intro"><h1>Organization setup</h1><p>These settings are used by attendance, leave and payroll rules.</p></div><form method="post" class="panel form-panel"><h2>Company & office</h2><div class="form-grid"><label>Company name<input name="company_name" value="{{ settings.company_name }}" required></label><label>Office start time<input type="time" name="office_start" value="{{ settings.office_start }}" required></label><label>Grace period (minutes)<input type="number" min="0" name="grace_minutes" value="{{ settings.grace_minutes }}" required></label><label>Half-day threshold (hours)<input type="number" step="0.5" min="0" name="half_day_hours" value="{{ settings.half_day_hours }}" required></label><label>Weekend weekdays (0=Mon … 6=Sun)<input name="weekend_days" value="{{ settings.weekend_days }}" required><small>Default 5,6 means Saturday and Sunday.</small></label><label>Office radius (metres)<input type="number" min="0" name="office_radius_m" value="{{ settings.office_radius_m }}"></label><label>Office latitude<input name="office_lat" value="{{ settings.office_lat }}" placeholder="Optional"></label><label>Office longitude<input name="office_lng" value="{{ settings.office_lng }}" placeholder="Optional"></label></div><h2>Annual leave quotas</h2><div class="form-grid"><label>Annual leave days<input type="number" min="0" step="1" name="annual_quota" value="{{ settings.annual_quota }}"></label><label>Sick leave days<input type="number" min="0" step="1" name="sick_quota" value="{{ settings.sick_quota }}"></label><label>Casual leave days<input type="number" min="0" step="1" name="casual_quota" value="{{ settings.casual_quota }}"></label></div><button class="btn primary">Save settings</button></form>{% endblock %}
